<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RebarSplice — 겹침이음 검출</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2b2f37;
    --fg: #e8e6e1; --dim: #8b8f98;
    --splice: #ff7a1a;          /* lap_splice — 주황 */
    --rebar: #4aa3ff;           /* rebar — 파랑 */
    --mono: "SF Mono", Consolas, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Malgun Gothic", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; letter-spacing: .5px; }
  header h1 b { color: var(--splice); }
  #status { font: 12px var(--mono); color: var(--dim); }
  main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 18px; max-width: 1100px; width: 100%; margin: 0 auto; }

  /* 업로드 */
  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 34px 16px;
    text-align: center; color: var(--dim); cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.armed { border-color: var(--splice); background: #ff7a1a11; }
  #drop input { display: none; }
  #drop .big { font-size: 15px; color: var(--fg); margin-bottom: 6px; }

  /* 컨트롤 */
  #controls {
    display: none; gap: 18px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
  }
  #controls label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  #conf { accent-color: var(--splice); width: 140px; }
  #confVal { font: 13px var(--mono); color: var(--fg); min-width: 34px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  #counts { font: 13px var(--mono); margin-left: auto; }
  #counts b { color: var(--splice); }
  #counts span { color: var(--rebar); }

  /* 캔버스 */
  #stage { position: relative; display: none; }
  #canvas { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); display: block; }
  #progress {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #14161acc; border-radius: 10px; font: 14px var(--mono); color: var(--fg);
    flex-direction: column; gap: 10px;
  }
  #bar { width: 220px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--splice); transition: width .2s; }

  footer { padding: 10px 18px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); }
  footer code { font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>Rebar<b>Splice</b> — 겹침이음 검출</h1>
  <span id="status">모델 로딩 중…</span>
</header>

<main>
  <label id="drop">
    <input id="file" type="file" accept="image/*">
    <div class="big">사진을 올리거나 여기를 누르세요</div>
    <div>배근 사진 · 처리 결과는 기기 밖으로 나가지 않습니다</div>
  </label>

  <div id="controls">
    <label><span class="swatch" style="background:var(--splice)"></span>겹침이음</label>
    <label><input id="showRebar" type="checkbox"><span class="swatch" style="background:var(--rebar)"></span>철근도 표시</label>
    <label>신뢰도
      <input id="conf" type="range" min="0.05" max="0.9" step="0.05" value="0.25">
      <span id="confVal">0.25</span>
    </label>
    <div id="counts"></div>
  </div>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="progress"><div id="progressText"></div><div id="bar"><i></i></div></div>
  </div>
</main>

<footer>
  추론은 브라우저 안(ONNX Runtime Web · WASM)에서 돕니다. 큰 사진은 학습 분포에 맞춰
  <code>960px</code> 타일로 잘라 처리합니다. 검측 도구는 놓치는 쪽이 더 나쁘므로 신뢰도를
  낮게 두고 과검출을 사람이 거르는 사용을 권합니다.
</footer>

<script src="./vendor/ort/ort.wasm.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
